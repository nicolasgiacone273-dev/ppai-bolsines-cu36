spring.application.name=bolsines-cu36

# La API mock de GPS Tracker de la catedra usa el 8080, por eso esta app usa el 8081
server.port=8081

# ---------------- Base de datos H2 (archivo en la carpeta ./data) ----------------
spring.datasource.url=jdbc:h2:file:./data/bolsines-db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola web para ver las tablas: http://localhost:8081/h2-console
# (JDBC URL: jdbc:h2:file:./data/bolsines-db;AUTO_SERVER=TRUE  usuario: sa  sin clave)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------- GPS Tracker (API mock de la catedra) ----------------
gps.tracker.xtr-4500l.url=http://localhost:8080/api/xtr-4500l
gps.tracker.xtr-4500l.api-key=sk_xtr_9F3a7C21bE6d4A10f2c8e5b7d913

gps.tracker.navtrack-qx-7a.url=http://localhost:8080/api/navtrack-qx-7a
gps.tracker.navtrack-qx-7a.api-key=sk_nav_7b61d9e4c3a2485fae10c77d5b2f

gps.tracker.geopulse-mtr-900.url=http://localhost:8080/api/geopulse-mtr-900
gps.tracker.geopulse-mtr-900.api-key=sk_geo_f2d84a1c9e7345b8a6d1c3f0972e

# ---------------- Mapa ----------------
# Si se carga una API key de Google Maps se usa Google Maps (RNF 7);
# si queda vacia se usa Leaflet + OpenStreetMap (gratis, sin key).
